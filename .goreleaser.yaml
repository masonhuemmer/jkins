version: 2

project_name: jkins

builds:
  - main: ./cmd/jkins
    binary: jkins
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/masonhuemmer/jkins/internal/cli.Version=v{{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

release:
  github:
    owner: masonhuemmer
    name: jkins

scoops:
  - name: jkins
    homepage: https://github.com/masonhuemmer/jkins
    description: Native Go Jenkins CLI with an encrypted local vault
    license: MIT
    skip_upload: true
    repository:
      owner: masonhuemmer
      name: scoop-bucket

winget:
  - name: jkins
    publisher: Jacob Huemmer
    package_identifier: JacobHuemmer.jkins
    short_description: Native Go Jenkins CLI with an encrypted local vault
    license: MIT
    homepage: https://github.com/masonhuemmer/jkins
    skip_upload: true
    repository:
      owner: masonhuemmer
      name: winget-pkgs
